<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart — GRUB</title>
<link rel="stylesheet" href="style.css">
<style>
.cart-page {
  padding: calc(var(--nav-h) + 48px) 48px 80px;
  max-width: 1180px; margin: 0 auto;
}
.cart-title { font-family: var(--font-head); font-size: 48px; font-weight: 800; letter-spacing: -2px; margin-bottom: 36px; }
.cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 28px; align-items: start; }

/* ── CART ITEMS ── */
.cart-items { display: flex; flex-direction: column; gap: 14px; }
.cart-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  display: flex; align-items: center; gap: 18px;
  animation: fadeUp 0.3s ease both;
  transition: border-color var(--transition);
}
.cart-item:hover { border-color: rgba(255,69,0,0.25); }
.cart-item-img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:18px;
  flex-shrink:0;
  border:1px solid var(--border);
}
  .upsell-img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid var(--border);
}
.cart-item-info { flex: 1; }
.cart-item-name { font-family: var(--font-head); font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.cart-item-desc { font-size: 12px; color: var(--muted2); }
.cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.cart-item-price { font-family: var(--font-head); font-size: 20px; font-weight: 800; color: var(--accent); }
.cart-remove {
  background: none; border: none; color: var(--muted2); cursor: pointer;
  font-size: 16px; transition: color var(--transition); padding: 2px;
}
.cart-remove:hover { color: var(--error); }

/* ── SUMMARY CARD ── */
.summary-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px;
  position: sticky; top: calc(var(--nav-h) + 20px);
}
.summary-title { font-family: var(--font-head); font-size: 20px; font-weight: 800; margin-bottom: 24px; }
.summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
.summary-row.total { font-family: var(--font-head); font-size: 20px; font-weight: 800; margin-top: 4px; }
.summary-row.total .val { color: var(--accent); }
.promo-row { display: flex; gap: 8px; margin: 20px 0; }
.promo-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 14px;
  color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none;
  transition: border-color var(--transition);
}
.promo-input:focus { border-color: var(--accent); }
.promo-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 16px;
  font-family: var(--font-head); font-size: 12px; font-weight: 700;
  color: var(--muted2); cursor: pointer; transition: all var(--transition);
}
.promo-btn:hover { border-color: var(--accent); color: var(--accent); }
.delivery-note {
  background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2);
  border-radius: var(--radius-sm); padding: 10px 14px;
  font-size: 12px; color: var(--success); margin-bottom: 20px;
}

/* ── UPSELL ── */
.upsell-section { margin-top: 40px; }
.upsell-title { font-family: var(--font-head); font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.upsell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.upsell-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: all var(--transition);
}
.upsell-card:hover { border-color: rgba(255,69,0,0.35); }
.upsell-emoji { font-size: 36px; }
.upsell-name { font-family: var(--font-head); font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.upsell-price { font-size: 12px; color: var(--accent); font-weight: 600; }
.upsell-add {
  margin-left: auto; width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent); border: none; color: #fff; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.upsell-add:hover { background: #ff6030; }

@media(max-width:900px){
  .cart-page { padding: calc(var(--nav-h) + 20px) 20px 60px; }
  .cart-layout { grid-template-columns: 1fr; }
  .summary-card { position: static; }
}
</style>
</head>
<body>
<div class="page-enter">

<main>
<div class="cart-page">
  <div class="cart-title" id="cart-title">🛒 My Cart</div>
  <div class="cart-layout">
    <!-- ITEMS -->
    <div>
      <div class="cart-items" id="cart-items"></div>
      <div class="upsell-section" id="upsell-section"></div>
    </div>

    <!-- SUMMARY -->
    <div class="summary-card" id="summary-card">
      <div class="summary-title">Order Summary</div>
      <div class="summary-row"><span>Subtotal</span><span id="sum-sub">₹0</span></div>
      <div class="summary-row"><span>Delivery fee</span><span id="sum-del">₹40</span></div>
      <div class="summary-row"><span id="disc-label" style="color:var(--success);display:none">Promo discount</span><span id="disc-val" style="color:var(--success);display:none"></span></div>
      <div class="divider"></div>
      <div class="summary-row total"><span>Total</span><span class="val" id="sum-total">₹0</span></div>
      <div class="promo-row">
        <input class="promo-input" id="promo-input" placeholder="Promo code">
        <button class="promo-btn" onclick="applyPromo()">Apply</button>
      </div>
      <div class="delivery-note" id="delivery-note"></div>
      <button class="btn btn-primary btn-full btn-lg" onclick="goCheckout()">Checkout →</button>
      <a class="btn btn-ghost btn-full" href="menu.html" style="margin-top:10px">← Continue Shopping</a>
    </div>
  </div>
</div>
</main>

<footer>
  <div class="footer-logo">GRUB<span>.</span></div>
  <div class="footer-copy">© 2025 GRUB Inc.</div>
</footer>
</div>

<script src="app.js"></script>
<script>
injectNav('cart.html');

const FREE_DELIVERY_AT = 299;
const DELIVERY_FEE = 40;
const PROMOS = { 'GRUB20': 20, 'NEWUSER': 15 };
let discount = 0;

function render(){
  const cart = Cart.get();
  const itemsEl = document.getElementById('cart-items');
  itemsEl.innerHTML = '';

  if (!cart.length){
    itemsEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🛒</div>
        <div class="empty-title">Your cart is empty</div>
        <div class="empty-desc">Add some delicious food from our menu!</div>
        <a class="btn btn-primary" href="menu.html">Browse Menu</a>
      </div>`;
    document.getElementById('summary-card').style.opacity='0.4';
    document.getElementById('upsell-section').style.display='none';
  } else {
    document.getElementById('summary-card').style.opacity='1';
    document.getElementById('upsell-section').style.display='';
    cart.forEach(item=>{
      const el = document.createElement('div');
      el.className = 'cart-item';
      el.innerHTML = `
        <img src="${item.image}" alt="${item.name}" class="cart-item-img">
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-desc">${item.desc}</div>
        </div>
        <div class="cart-item-right">
          <div class="cart-item-price">${fmt.price(item.price * item.qty)}</div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
          </div>
          <button class="cart-remove" onclick="removeItem(${item.id})" title="Remove">🗑️</button>
        </div>`;
      itemsEl.appendChild(el);
    });
  }
  updateSummary();
  buildUpsell();
}

function updateSummary(){
  const sub = Cart.total();
  const freeDelivery = sub >= FREE_DELIVERY_AT;
  const del = freeDelivery ? 0 : DELIVERY_FEE;
  const disc = Math.round(sub * discount / 100);
  const total = sub + del - disc;

  document.getElementById('sum-sub').textContent = fmt.price(sub);
  document.getElementById('sum-del').textContent = freeDelivery ? 'FREE 🎉' : fmt.price(del);
  document.getElementById('sum-total').textContent = fmt.price(Math.max(0, total));

  const note = document.getElementById('delivery-note');
  if (freeDelivery) { note.textContent = '🎉 You qualify for free delivery!'; }
  else { note.textContent = `Add ${fmt.price(FREE_DELIVERY_AT - sub)} more for free delivery`; }

  const discLabel = document.getElementById('disc-label');
  const discVal = document.getElementById('disc-val');
  if (disc > 0){ discLabel.style.display=''; discVal.style.display=''; discVal.textContent='-'+fmt.price(disc); }
  else { discLabel.style.display='none'; discVal.style.display='none'; }
}

function changeQty(id, delta){
  const cart = Cart.get();
  const item = cart.find(c=>c.id===id);
  if (item) Cart.updateQty(id, item.qty + delta);
  render();
}
function removeItem(id){ Cart.remove(id); render(); toast('Item removed', 'info'); }

function applyPromo(){
  const code = document.getElementById('promo-input').value.trim().toUpperCase();
  if (PROMOS[code]){ discount=PROMOS[code]; updateSummary(); toast(`Promo applied! ${discount}% off 🎉`, 'success'); }
  else { toast('Invalid promo code', 'error'); }
}

function goCheckout(){
  if (!Cart.count()){ toast('Add items to cart first', 'error'); return; }
  window.location = 'checkout.html';
}

function buildUpsell(){
  const cartIds = Cart.get().map(c=>c.id);
  const suggestions = MENU.filter(m=>!cartIds.includes(m.id)).slice(0,4);
  const sec = document.getElementById('upsell-section');
  if (!suggestions.length){ sec.innerHTML=''; return; }
  sec.innerHTML=`<div class="upsell-title">You might also like</div><div class="upsell-grid" id="upsell-grid"></div>`;
  const grid = document.getElementById('upsell-grid');
  suggestions.forEach(item=>{
    const el = document.createElement('div');
    el.className='upsell-card';
    el.innerHTML=`
      <img src="${item.image}" class="upsell-img">
      <div><div class="upsell-name">${item.name}</div><div class="upsell-price">${fmt.price(item.price)}</div></div>
      <button class="upsell-add" onclick="addToCart(${item.id});render()">+</button>`;
    grid.appendChild(el);
  });
}

render();
</script>
</body>
</html>
